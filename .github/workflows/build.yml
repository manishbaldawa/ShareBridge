name: Build APK

# Self-contained: this single file creates the whole ShareBridge Android project
# at build time, so nothing else needs to be uploaded to the repository.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on GitHub's ubuntu runners.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          set -e
          mkdir -p proj && cd proj
          cat > settings.gradle.kts <<'EOF_SHAREBRIDGE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShareBridge"
          include(":app")
          EOF_SHAREBRIDGE
          cat > build.gradle.kts <<'EOF_SHAREBRIDGE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_SHAREBRIDGE
          cat > gradle.properties <<'EOF_SHAREBRIDGE'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_SHAREBRIDGE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_SHAREBRIDGE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.sharebridge.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.sharebridge.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_SHAREBRIDGE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Needed on Android 11+ so we can see and target these two apps -->
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="ir.ilmili.telegraph" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_menu_share"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Share target #1: appears in the share sheet as "To WhatsApp" -->
                  <activity
                      android:name=".ToWhatsAppActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:label="@string/to_whatsapp"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                  </activity>

                  <!-- Share target #2: appears in the share sheet as "To Graph Messenger" -->
                  <activity
                      android:name=".ToGraphActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:label="@string/to_graph"
                      android:taskAffinity=""
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                  </activity>

                  <!-- Floating "Caption" button shown only over Graph Messenger and WhatsApp -->
                  <service
                      android:name=".FloatingService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_SHAREBRIDGE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">ShareBridge</string>
              <string name="to_whatsapp">To WhatsApp</string>
              <string name="to_graph">To Graph Messenger</string>
              <string name="a11y_description">Shows a small floating Caption button over Graph Messenger and WhatsApp. When you tap it, ShareBridge reads the text visible in that app so you can pick a caption to copy. It does nothing else and sends nothing anywhere.</string>
          </resources>
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/file_paths.xml <<'EOF_SHAREBRIDGE'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="shared" path="shared/" />
          </paths>
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/java/com/sharebridge/app
          cat > app/src/main/java/com/sharebridge/app/BaseForwardActivity.kt <<'EOF_SHAREBRIDGE'
          package com.sharebridge.app

          import android.app.Activity
          import android.content.ActivityNotFoundException
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.OpenableColumns
          import android.webkit.MimeTypeMap
          import android.widget.Toast
          import androidx.core.content.FileProvider
          import androidx.core.content.IntentCompat
          import java.io.File
          import java.util.UUID

          /**
           * Receives a normal Android share (ACTION_SEND / ACTION_SEND_MULTIPLE) from any app,
           * copies the media into this app's cache (so the receiving app can always read it),
           * and re-sends it, together with the caption text, straight to [targetPackage].
           */
          abstract class BaseForwardActivity : Activity() {

              abstract val targetPackage: String
              abstract val targetLabel: String

              private class Payload(
                  val text: String?,
                  val captionSource: String,
                  val uris: List<Uri>,
                  val mimes: List<String>,
                  val notes: List<String>
              )

              private var started = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val action = intent?.action
                  if (action != Intent.ACTION_SEND && action != Intent.ACTION_SEND_MULTIPLE) {
                      finish()
                      return
                  }
                  // We wait for window focus (Android only lets a focused app read the clipboard),
                  // but never longer than a moment.
                  Handler(Looper.getMainLooper()).postDelayed({ begin() }, 800)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) begin()
              }

              private fun begin() {
                  if (started || isFinishing) return
                  started = true
                  val incoming = intent
                  val clip = if (Store.clipCaption(this)) recentClipboardText() else null
                  val header = "To $targetLabel | from=${referrer?.host ?: "?"} | " +
                      "${incoming.action?.substringAfterLast('.')} type=${incoming.type} | " +
                      "extras=${incoming.extras?.keySet()?.joinToString(",") ?: "-"}"

                  toast("Sending to $targetLabel…")
                  Thread {
                      val result = runCatching { prepare(incoming, clip) }
                      runOnUiThread {
                          result
                              .onSuccess { p -> launchTarget(p, header) }
                              .onFailure { e ->
                                  Store.log(this, "$header | READ FAILED: $e")
                                  toast("Couldn't read the shared post: ${e.message}")
                              }
                          finish()
                      }
                  }.start()
              }

              // ---------- reading what was shared ----------

              private fun recentClipboardText(): String? {
                  return try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      val clip = cm.primaryClip
                      if (clip == null || clip.itemCount == 0) {
                          null
                      } else {
                          val ageMs = System.currentTimeMillis() - clip.description.timestamp
                          if (ageMs > 10 * 60 * 1000L) null
                          else clip.getItemAt(0).coerceToText(this)?.toString()?.takeIf { it.isNotBlank() }
                      }
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun prepare(incoming: Intent, clip: String?): Payload {
                  val shared = incoming.getCharSequenceExtra(Intent.EXTRA_TEXT)?.toString()?.takeIf { it.isNotBlank() }
                      ?: incoming.clipData?.let { cd ->
                          (0 until cd.itemCount).firstNotNullOfOrNull {
                              cd.getItemAt(it).text?.toString()?.takeIf { s -> s.isNotBlank() }
                          }
                      }
                  val text = shared ?: clip
                  val captionSource = when {
                      shared != null -> "shared"
                      clip != null -> "clipboard"
                      else -> "none"
                  }

                  val sources = ArrayList<Uri>()
                  if (incoming.action == Intent.ACTION_SEND) {
                      IntentCompat.getParcelableExtra(incoming, Intent.EXTRA_STREAM, Uri::class.java)?.let { sources.add(it) }
                  } else {
                      IntentCompat.getParcelableArrayListExtra(incoming, Intent.EXTRA_STREAM, Uri::class.java)
                          ?.let { sources.addAll(it) }
                  }
                  if (sources.isEmpty()) {
                      incoming.clipData?.let { cd ->
                          for (i in 0 until cd.itemCount) cd.getItemAt(i).uri?.let { sources.add(it) }
                      }
                  }
                  if (sources.isEmpty() && text == null) {
                      error("nothing to forward (no file and no text in the share)")
                  }

                  val dir = File(cacheDir, "shared").apply { mkdirs() }
                  cleanOldFiles(dir)

                  val uris = ArrayList<Uri>()
                  val mimes = ArrayList<String>()
                  val notes = ArrayList<String>()
                  for (src in sources) {
                      try {
                          val (uri, mime) = copyToCache(src, dir, incoming.type)
                          uris.add(uri)
                          mimes.add(mime)
                      } catch (e: Exception) {
                          // Couldn't copy: hand the original link over instead of failing.
                          notes.add("copy failed (${e.javaClass.simpleName}); sent original")
                          uris.add(src)
                          mimes.add(specific(incoming.type) ?: specific(contentResolver.getType(src)) ?: "*/*")
                      }
                  }
                  return Payload(text, captionSource, uris, mimes, notes)
              }

              private fun copyToCache(src: Uri, dir: File, incomingType: String?): Pair<Uri, String> {
                  val name = displayName(src) ?: "file"
                  val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_")
                  var dest = File(dir, "${UUID.randomUUID().toString().take(8)}_$safe")
                  val input = contentResolver.openInputStream(src) ?: error("cannot open $src")
                  input.use { i -> dest.outputStream().use { o -> i.copyTo(o) } }

                  val mime = specific(contentResolver.getType(src))
                      ?: specific(guessMime(safe))
                      ?: sniff(dest)
                      ?: specific(incomingType)
                      ?: "application/octet-stream"

                  // WhatsApp relies on the extension, so add one if the source had none.
                  if (dest.extension.isEmpty()) {
                      MimeTypeMap.getSingleton().getExtensionFromMimeType(mime)?.let { ext ->
                          val renamed = File(dir, dest.name + "." + ext)
                          if (dest.renameTo(renamed)) dest = renamed
                      }
                  }
                  return FileProvider.getUriForFile(this, "$packageName.fileprovider", dest) to mime
              }

              private fun specific(m: String?): String? =
                  m?.takeIf { it.isNotBlank() && !it.endsWith("/*") && it != "application/octet-stream" }

              private fun displayName(uri: Uri): String? = runCatching {
                  contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { c ->
                      if (c.moveToFirst()) c.getString(0) else null
                  }
              }.getOrNull() ?: uri.lastPathSegment

              private fun guessMime(name: String): String? {
                  val ext = name.substringAfterLast('.', "").lowercase()
                  if (ext.isEmpty()) return null
                  return MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext)
              }

              /** Last resort: look at the first bytes of the file. */
              private fun sniff(f: File): String? {
                  val b = ByteArray(16)
                  val n = f.inputStream().use { it.read(b) }
                  if (n < 4) return null
                  fun at(i: Int, s: String): Boolean =
                      n >= i + s.length && s.indices.all { b[i + it] == s[it].code.toByte() }
                  return when {
                      b[0] == 0xFF.toByte() && b[1] == 0xD8.toByte() -> "image/jpeg"
                      at(1, "PNG") -> "image/png"
                      at(0, "GIF8") -> "image/gif"
                      at(0, "RIFF") && at(8, "WEBP") -> "image/webp"
                      at(4, "ftyp") -> "video/mp4"
                      at(0, "OggS") -> "audio/ogg"
                      at(0, "ID3") -> "audio/mpeg"
                      at(0, "%PDF") -> "application/pdf"
                      else -> null
                  }
              }

              private fun cleanOldFiles(dir: File) {
                  val cutoff = System.currentTimeMillis() - 24L * 60 * 60 * 1000
                  dir.listFiles()?.forEach { if (it.lastModified() < cutoff) it.delete() }
              }

              // ---------- re-sharing ----------

              private fun launchTarget(p: Payload, header: String) {
                  val multi = p.uris.size > 1
                  val send = Intent(if (multi) Intent.ACTION_SEND_MULTIPLE else Intent.ACTION_SEND)
                  send.setPackage(targetPackage)
                  send.type = when {
                      p.uris.isEmpty() -> "text/plain"
                      !multi -> p.mimes[0]
                      else -> commonType(p.mimes)
                  }
                  p.text?.let { send.putExtra(Intent.EXTRA_TEXT, it) }

                  if (p.uris.isNotEmpty()) {
                      if (multi) send.putParcelableArrayListExtra(Intent.EXTRA_STREAM, ArrayList(p.uris))
                      else send.putExtra(Intent.EXTRA_STREAM, p.uris[0])
                      val clip = ClipData.newUri(contentResolver, "shared", p.uris[0])
                      p.uris.drop(1).forEach { clip.addItem(ClipData.Item(it)) }
                      send.clipData = clip
                      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }

                  // Most apps ignore the caption when several files are sent at once, so keep it on the clipboard too.
                  if (multi && p.text != null) {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("caption", p.text))
                      toast("Caption copied - paste it if it doesn't appear")
                  } else if (p.captionSource == "clipboard") {
                      toast("No caption in the share - using the text you copied")
                  }

                  val summary = "$header | sent type=${send.type} files=${p.uris.size} caption=${p.captionSource}" +
                      (if (p.notes.isEmpty()) "" else " | " + p.notes.joinToString("; "))
                  try {
                      startActivity(send)
                      Store.log(this, "$summary | OK")
                  } catch (e: ActivityNotFoundException) {
                      Store.log(this, "$summary | NOT FOUND: $e")
                      toast("$targetLabel isn't installed or can't receive this share")
                  } catch (e: Exception) {
                      Store.log(this, "$summary | FAILED: $e")
                      toast("Couldn't open $targetLabel: ${e.message}")
                  }
              }

              private fun commonType(mimes: List<String>): String {
                  if (mimes.all { it == mimes[0] }) return mimes[0]
                  val top = mimes.map { it.substringBefore('/') }
                  return if (top.all { it == top[0] }) "${top[0]}/*" else "*/*"
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/java/com/sharebridge/app
          cat > app/src/main/java/com/sharebridge/app/ToWhatsAppActivity.kt <<'EOF_SHAREBRIDGE'
          package com.sharebridge.app

          /** Share target that forwards to the standard WhatsApp. */
          class ToWhatsAppActivity : BaseForwardActivity() {
              override val targetPackage = "com.whatsapp"
              override val targetLabel = "WhatsApp"
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/java/com/sharebridge/app
          cat > app/src/main/java/com/sharebridge/app/ToGraphActivity.kt <<'EOF_SHAREBRIDGE'
          package com.sharebridge.app

          /** Share target that forwards to Graph Messenger. */
          class ToGraphActivity : BaseForwardActivity() {
              override val targetPackage = "ir.ilmili.telegraph"
              override val targetLabel = "Graph Messenger"
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/java/com/sharebridge/app
          cat > app/src/main/java/com/sharebridge/app/MainActivity.kt <<'EOF_SHAREBRIDGE'
          package com.sharebridge.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          /** Info screen: install status, floating-button setup, caption option and a log of recent shares. */
          class MainActivity : Activity() {

              private lateinit var statusView: TextView
              private lateinit var logView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (16 * resources.displayMetrics.density).toInt()

                  val column = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                  }

                  column.addView(TextView(this).apply {
                      text = infoText()
                      textSize = 16f
                  })

                  statusView = TextView(this).apply {
                      textSize = 16f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, pad, 0, pad / 2)
                  }
                  column.addView(statusView)

                  column.addView(Button(this).apply {
                      text = "1) Allow restricted settings (App info)"
                      setOnClickListener {
                          startActivity(
                              Intent(
                                  Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                  Uri.parse("package:" + this@MainActivity.packageName)
                              )
                          )
                      }
                  })
                  column.addView(Button(this).apply {
                      text = "2) Turn on the floating button"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  })

                  column.addView(Switch(this).apply {
                      text = "If the post has no caption, use text I copied in the last 10 minutes"
                      isChecked = Store.clipCaption(this@MainActivity)
                      setPadding(0, pad, 0, pad)
                      setOnCheckedChangeListener { _, checked -> Store.setClipCaption(this@MainActivity, checked) }
                  })

                  column.addView(TextView(this).apply {
                      text = "Recent shares (for troubleshooting)"
                      textSize = 16f
                      setTypeface(typeface, Typeface.BOLD)
                  })

                  logView = TextView(this).apply {
                      textSize = 12f
                      typeface = Typeface.MONOSPACE
                      setTextIsSelectable(true)
                      setPadding(0, pad / 2, 0, pad / 2)
                  }
                  column.addView(logView)

                  column.addView(Button(this).apply {
                      text = "Clear log"
                      setOnClickListener {
                          Store.clearLog(this@MainActivity)
                          refresh()
                      }
                  })

                  setContentView(ScrollView(this).apply { addView(column) })
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  logView.text = Store.readLog(this)
                  statusView.text =
                      if (serviceOn()) "Floating button: ON" else "Floating button: OFF (follow steps 1 and 2 below)"
              }

              private fun serviceOn(): Boolean {
                  val enabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      ?: return false
                  return enabled.contains(packageName) && enabled.contains("FloatingService")
              }

              private fun infoText(): String {
                  fun installed(pkg: String) = runCatching { packageManager.getPackageInfo(pkg, 0) }.isSuccess
                  fun mark(ok: Boolean) = if (ok) "installed" else "NOT FOUND"
                  return """
                      ShareBridge

                      WhatsApp (com.whatsapp): ${mark(installed("com.whatsapp"))}
                      Graph Messenger (ir.ilmili.telegraph): ${mark(installed("ir.ilmili.telegraph"))}

                      How to share a post with its caption
                      1. In Graph Messenger open the post, so its caption is on screen.
                      2. Tap the floating "Caption" button, then tap the caption in the list. It is copied.
                      3. Tap Share on the post and choose "To WhatsApp".
                      4. WhatsApp opens with the media and the caption ready - pick the chat and send.

                      The other way round: in WhatsApp share the post and choose "To Graph Messenger" (WhatsApp already passes the caption).

                      The floating button appears only over Graph Messenger and WhatsApp, and you can drag it anywhere. It needs the Accessibility permission, which Android only lets you switch on after "Allow restricted settings" for apps installed outside the Play Store (App info > three-dot menu).
                  """.trimIndent()
              }
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/java/com/sharebridge/app
          cat > app/src/main/java/com/sharebridge/app/Store.kt <<'EOF_SHAREBRIDGE'
          package com.sharebridge.app

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Tiny settings + troubleshooting-log store. */
          object Store {
              private const val PREFS = "sharebridge"
              private const val KEY_LOG = "log"
              private const val KEY_CLIP = "clip_caption"

              private fun prefs(ctx: Context) = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun clipCaption(ctx: Context): Boolean = prefs(ctx).getBoolean(KEY_CLIP, true)

              fun setClipCaption(ctx: Context, on: Boolean) {
                  prefs(ctx).edit().putBoolean(KEY_CLIP, on).apply()
              }

              fun buttonPos(ctx: Context): Pair<Int, Int>? {
                  val p = prefs(ctx)
                  return if (p.contains("btn_x")) Pair(p.getInt("btn_x", 0), p.getInt("btn_y", 0)) else null
              }

              fun setButtonPos(ctx: Context, x: Int, y: Int) {
                  prefs(ctx).edit().putInt("btn_x", x).putInt("btn_y", y).apply()
              }

              @Synchronized
              fun log(ctx: Context, line: String) {
                  val p = prefs(ctx)
                  val old = (p.getString(KEY_LOG, "") ?: "").split("\n").filter { it.isNotBlank() }
                  val stamp = SimpleDateFormat("dd MMM HH:mm:ss", Locale.getDefault()).format(Date())
                  val all = (listOf("$stamp  $line") + old).take(12)
                  p.edit().putString(KEY_LOG, all.joinToString("\n")).apply()
              }

              fun readLog(ctx: Context): String =
                  (prefs(ctx).getString(KEY_LOG, "") ?: "").ifBlank { "(nothing shared yet)" }

              fun clearLog(ctx: Context) {
                  prefs(ctx).edit().remove(KEY_LOG).apply()
              }
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/java/com/sharebridge/app
          cat > app/src/main/java/com/sharebridge/app/FloatingService.kt <<'EOF_SHAREBRIDGE'
          package com.sharebridge.app

          import android.accessibilityservice.AccessibilityService
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          /**
           * Shows a small draggable "Caption" button on top of Graph Messenger and WhatsApp only.
           *
           * Tapping it reads the text currently visible in that app, lists the longest pieces of text,
           * and copies the one you pick to the clipboard. ShareBridge then uses that text as the caption
           * the next time you share media to the other app.
           *
           * Android's accessibility permission is all-or-nothing, so this service technically receives window
           * events from every app. It only looks at the package name of those events (to know when to show or
           * hide the button) and only reads on-screen text when you tap the button inside Graph or WhatsApp.
           * Nothing is sent anywhere: the app has no internet permission.
           */
          class FloatingService : AccessibilityService() {

              private val graphPkg = "ir.ilmili.telegraph"
              private val whatsappPkg = "com.whatsapp"

              private lateinit var wm: WindowManager
              private var button: TextView? = null
              private var panel: View? = null
              private var currentPkg: String? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  val cls = event.className?.toString() ?: ""

                  if (pkg == packageName) {
                      // One of our own screens (main screen / share forwarder) came up: hide the overlay.
                      if (cls.endsWith("Activity")) hideAll()
                      return
                  }
                  // System bars, keyboard and the share chooser must not hide or move the button.
                  if (pkg == "android" || pkg.contains("systemui") || pkg.contains("inputmethod") ||
                      cls.contains("SoftInputWindow")
                  ) return

                  if (pkg == graphPkg || pkg == whatsappPkg) {
                      currentPkg = pkg
                      showButton()
                  } else {
                      currentPkg = null
                      hideAll()
                  }
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  if (::wm.isInitialized) hideAll()
                  super.onDestroy()
              }

              // ---------- floating button ----------

              private fun showButton() {
                  if (button != null) return
                  val dm = resources.displayMetrics
                  val d = dm.density

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val saved = Store.buttonPos(this)
                  lp.x = saved?.first ?: (dm.widthPixels - (140 * d).toInt())
                  lp.y = saved?.second ?: (dm.heightPixels * 0.55).toInt()

                  val tv = TextView(this)
                  tv.text = "📋 Caption"
                  tv.setTextColor(Color.WHITE)
                  tv.textSize = 13f
                  tv.gravity = Gravity.CENTER
                  val p = (10 * d).toInt()
                  tv.setPadding(p * 2, p, p * 2, p)
                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor("#E60A84FF"))
                  bg.cornerRadius = 100f * d
                  tv.background = bg

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var moved = false
                  tv.setOnTouchListener { v, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = ev.rawX
                              downY = ev.rawY
                              startX = lp.x
                              startY = lp.y
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (ev.rawX - downX).toInt()
                              val dy = (ev.rawY - downY).toInt()
                              if (abs(dx) > 12 || abs(dy) > 12) moved = true
                              if (moved) {
                                  lp.x = startX + dx
                                  lp.y = startY + dy
                                  try {
                                      wm.updateViewLayout(v, lp)
                                  } catch (e: Exception) {
                                  }
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (moved) Store.setButtonPos(this, lp.x, lp.y) else onGrabClicked()
                              true
                          }
                          else -> false
                      }
                  }

                  try {
                      wm.addView(tv, lp)
                      button = tv
                  } catch (e: Exception) {
                      Store.log(this, "Floating button could not be shown: $e")
                  }
              }

              // ---------- reading the caption ----------

              private fun onGrabClicked() {
                  if (panel != null) {
                      hidePanel()
                      return
                  }
                  val root = rootInActiveWindow
                  val pkg = root?.packageName?.toString()
                  if (root == null || (pkg != graphPkg && pkg != whatsappPkg)) {
                      toast("Open the post in Graph Messenger or WhatsApp first")
                      return
                  }
                  val texts = LinkedHashSet<String>()
                  collect(root, texts, 0)
                  val top = texts.sortedByDescending { it.length }.take(5)
                  if (top.isEmpty()) {
                      toast("No text found on screen. Open the post so its caption is visible.")
                      return
                  }
                  showPanel(top)
              }

              private fun collect(node: AccessibilityNodeInfo?, out: MutableSet<String>, depth: Int) {
                  if (node == null || depth > 40 || out.size > 200) return
                  if (node.isVisibleToUser) {
                      val t = (node.text ?: node.contentDescription)?.toString()?.trim()
                      if (!t.isNullOrEmpty() && t.length >= 6 && t.length <= 4000) out.add(t)
                  }
                  for (i in 0 until node.childCount) collect(node.getChild(i), out, depth + 1)
              }

              // ---------- picker panel ----------

              private fun showPanel(items: List<String>) {
                  hidePanel()
                  val dm = resources.displayMetrics
                  val d = dm.density
                  val pad = (12 * d).toInt()

                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(pad, pad, pad, pad)
                  val boxBg = GradientDrawable()
                  boxBg.setColor(Color.parseColor("#F2202124"))
                  boxBg.cornerRadius = 16 * d
                  box.background = boxBg

                  val title = TextView(this)
                  title.text = "Tap the caption to copy it"
                  title.setTextColor(Color.WHITE)
                  title.textSize = 15f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  box.addView(title)

                  for (item in items) {
                      val row = TextView(this)
                      row.text = item
                      row.setTextColor(Color.WHITE)
                      row.textSize = 14f
                      row.maxLines = 4
                      row.ellipsize = TextUtils.TruncateAt.END
                      row.setPadding(pad, pad, pad, pad)
                      val rowBg = GradientDrawable()
                      rowBg.setColor(Color.parseColor("#3C4043"))
                      rowBg.cornerRadius = 10 * d
                      row.background = rowBg
                      row.setOnClickListener { copyCaption(item) }
                      val rlp = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                      rlp.topMargin = (8 * d).toInt()
                      box.addView(row, rlp)
                  }

                  val cancel = TextView(this)
                  cancel.text = "Cancel"
                  cancel.setTextColor(Color.parseColor("#8AB4F8"))
                  cancel.textSize = 14f
                  cancel.gravity = Gravity.CENTER
                  cancel.setPadding(pad, pad, pad, pad)
                  cancel.setOnClickListener { hidePanel() }
                  box.addView(cancel)

                  val scroll = ScrollView(this)
                  scroll.addView(box)

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      (dm.heightPixels * 0.6).toInt(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.BOTTOM

                  try {
                      wm.addView(scroll, lp)
                      panel = scroll
                  } catch (e: Exception) {
                      Store.log(this, "Caption picker could not be shown: $e")
                  }
              }

              private fun copyCaption(text: String) {
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("caption", text))
                  val target = if (currentPkg == graphPkg) "To WhatsApp" else "To Graph Messenger"
                  hidePanel()
                  Store.log(this, "Caption copied in ${currentPkg ?: "?"} (${text.length} chars)")
                  toast("Caption copied. Now tap Share and choose \"$target\".")
              }

              // ---------- helpers ----------

              private fun hidePanel() {
                  panel?.let {
                      try {
                          wm.removeViewImmediate(it)
                      } catch (e: Exception) {
                      }
                  }
                  panel = null
              }

              private fun hideAll() {
                  hidePanel()
                  button?.let {
                      try {
                          wm.removeViewImmediate(it)
                      } catch (e: Exception) {
                      }
                  }
                  button = null
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_LONG).show()
          }
          EOF_SHAREBRIDGE
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_SHAREBRIDGE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/a11y_description"
              android:notificationTimeout="200"
              android:settingsActivity="com.sharebridge.app.MainActivity" />
          EOF_SHAREBRIDGE
          find . -type f | sort

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ShareBridge-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
